[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FMOtpiefinal"
version = "0.1.0rc1"
description = "Audited structure preparation and GAMESS FMO full-tPIE ranking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.10", "rdkit>=2024.3"]

[project.optional-dependencies]
compute = ["openmm>=8.4", "openmmforcefields>=0.15", "openff-toolkit>=0.18", "pdbfixer>=1.12", "pdb2pqr>=3.6", "gemmi>=0.6"]
test = ["pytest>=7", "openmm>=8.4", "gemmi>=0.6"]

[project.scripts]
fmotpiefinal = "fmotpiefinal.pipeline.cli:main"
fmotpiefinal-doctor = "fmotpiefinal.doctor:main"

[project.urls]
Repository = "https://github.com/paolellopotanovic-ctrlxiaoke/FMO"
Issues = "https://github.com/paolellopotanovic-ctrlxiaoke/FMO/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fmotpiefinal*"]

[tool.setuptools.package-data]
fmotpiefinal = ["references/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
