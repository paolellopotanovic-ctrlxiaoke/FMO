[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sophosqm-style-fmo-baseline"
version = "0.1.1"
description = "Independent GAMESS-backed SophosQM-style FMO affinity baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5", "pyyaml>=6", "scipy>=1.10"]

[project.optional-dependencies]
chem = ["rdkit>=2024.3"]
production = [
    "rdkit>=2024.3",
    "openmm>=8.4",
    "openmmforcefields>=0.15",
    "openff-toolkit>=0.18",
]
test = ["pytest>=7.0", "rdkit>=2024.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
